<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>土豆 · 网页版聊天</title>
<style>
:root{--bg:#f7f5f0;--panel:#fffdf9;--ink:#1d1a16;--mut:#6f675c;--line:#e3ddd2;--acc:#b3392e;--acc2:#0d7a5f;--bubble:#fff;--me:#b3392e}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--panel:#1e1b18;--ink:#ece7de;--mut:#a79c8e;--line:#37322c;--bubble:#24211d;--me:#c0453a}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;display:flex;flex-direction:column}
header{padding:14px 18px 10px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}header .sub{color:var(--mut);font-size:13px}
header .sp{flex:1}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
#settings{display:none;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);font-size:14px}
#settings.open{display:block}
#settings label{display:block;margin:8px 0 3px;color:var(--mut)}
#settings input,#settings select,#settings textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
#settings .hint{color:var(--mut);font-size:12.5px;margin-top:8px}
#chat{flex:1;overflow-y:auto;padding:18px;max-width:860px;width:100%;margin:0 auto}
.msg{display:flex;margin:0 0 14px;gap:10px}.msg .who{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel);border:1px solid var(--line)}
.msg .body{background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(680px,82vw);white-space:pre-wrap;word-break:break-word}
.msg.me{flex-direction:row-reverse}.msg.me .body{background:var(--me);border-color:var(--me);color:#fff}
.msg .body pre{background:rgba(0,0,0,.08);padding:10px;border-radius:8px;overflow-x:auto;white-space:pre}
.msg .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
.err{color:var(--acc);font-size:14px}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
footer .row{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#input{flex:1;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;max-height:160px}
#send{background:var(--acc);border-color:var(--acc);color:#fff;padding:10px 20px;border-radius:12px}
#send:disabled{opacity:.5}
.note{max-width:860px;margin:6px auto 0;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>🥔 土豆 · 网页版</h1>
  <span class="sub">免翻墙 · 浏览器直连国内模型接口 · 多轮对话</span>
  <span class="sp"></span>
  <button id="btnSettings" type="button">⚙ 设置</button>
  <button id="btnClear" type="button">清空对话</button>
</header>

<div id="settings">
  <label>接口预设</label>
  <select id="preset">
    <option value="proxy">本站通道（免填 key，打开就能用）</option>
    <option value="modelscope">魔搭 ModelScope（国内直连，已实测支持浏览器跨域）</option>
    <option value="siliconflow">硅基流动 SiliconFlow（国内直连，已实测支持浏览器跨域）</option>
    <option value="dashscope">阿里云百炼 DashScope（国内直连，已实测支持浏览器跨域）</option>
    <option value="custom">自定义（任何 OpenAI 兼容接口）</option>
  </select>
  <label>接口地址 Base URL</label>
  <input id="base" autocomplete="off" spellcheck="false">
  <label>模型名</label>
  <input id="model" autocomplete="off" spellcheck="false">
  <label>API Key（只存在你这台设备的浏览器里，不写进网页、不上传）</label>
  <input id="key" type="password" autocomplete="off" placeholder="粘贴你的 key，保存后刷新也不会丢">
  <label>人设 / 系统提示词</label>
  <textarea id="sys" rows="3"></textarea>
  <div style="margin-top:10px"><button id="btnSave" type="button">保存设置</button> <span id="saved" class="hint"></span></div>
  <p class="hint">说明：「本站通道」经 Cloudflare Worker 中转到魔搭 Qwen/Qwen3.8-27B（免费额度内），key 放在 Worker 服务端，任何设备打开就能用。其余预设是你自带 key 的直连模式，key 只存本设备浏览器。换预设会自动填地址和示例模型，模型名可改。</p>
</div>

<main id="chat"></main>

<footer>
  <div class="row">
    <textarea id="input" rows="2" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="button">发送</button>
  </div>
  <p class="note">注意：这是用国内免费模型驱动的「土豆人设」网页版，能聊天、记得本页上下文，但没有 App 里土豆的长期记忆和工具。重要/复杂的事还是回 App 找我。</p>
</footer>

<script>
"use strict";
const PRESETS={
  proxy:{base:"/chat-api",model:"Qwen/Qwen3.8-27B"},
  modelscope:{base:"https://api-inference.modelscope.cn/v1",model:"Qwen/Qwen3.8-27B"},
  siliconflow:{base:"https://api.siliconflow.cn/v1",model:"Qwen/Qwen2.5-7B-Instruct"},
  dashscope:{base:"https://dashscope.aliyuncs.com/compatible-mode/v1",model:"qwen-turbo"},
  custom:{base:"",model:""}
};
const DEFAULT_SYS="你是土豆，John 的个人助理。用中文回答，直接、具体、少客套。先给结论，再给必要的细节；不知道就说不知道，不编造。";
const $=id=>document.getElementById(id);
const store={get(){try{return JSON.parse(localStorage.getItem("tudou-chat")||"{}")}catch(e){return{}}},set(v){localStorage.setItem("tudou-chat",JSON.stringify(v))}};
let cfg=Object.assign({preset:"proxy",base:PRESETS.proxy.base,model:PRESETS.proxy.model,key:"",sys:DEFAULT_SYS},store.get());
let messages=[]; // {role, content} 不含 system
let busy=false, aborter=null;

function applyCfg(){$("preset").value=cfg.preset;$("base").value=cfg.base;$("model").value=cfg.model;$("key").value=cfg.key;$("sys").value=cfg.sys;}
applyCfg();
$("preset").addEventListener("change",()=>{const p=PRESETS[$("preset").value];if(p){$("base").value=p.base;$("model").value=p.model;}});
$("btnSettings").addEventListener("click",()=>$("settings").classList.toggle("open"));
$("btnSave").addEventListener("click",()=>{cfg={preset:$("preset").value,base:$("base").value.trim().replace(/\/+$/,""),model:$("model").value.trim(),key:$("key").value.trim(),sys:$("sys").value};store.set(cfg);$("saved").textContent="已保存 ✓";setTimeout(()=>$("saved").textContent="",2000);});
$("btnClear").addEventListener("click",()=>{messages=[];$("chat").innerHTML="";hello();});

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(text){ // 极简:转义后处理代码块与行内代码
  let h=esc(text);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>"<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  return h;
}
function addMsg(role,text){
  const wrap=document.createElement("div");wrap.className="msg"+(role==="user"?" me":"");
  wrap.innerHTML='<div class="who">'+(role==="user"?"🧑":"🥔")+'</div><div class="body"></div>';
  wrap.querySelector(".body").innerHTML=render(text);
  $("chat").appendChild(wrap);$("chat").scrollTop=$("chat").scrollHeight;
  return wrap.querySelector(".body");
}
function hello(){addMsg("assistant","在的。这是网页版土豆：默认走本站通道，打开就能聊，不用填 key。直接打字发送试试。");}
hello();

async function send(){
  if(busy)return;
  const text=$("input").value.trim();if(!text)return;
  if(!cfg.key&&cfg.preset!=="proxy"){$("settings").classList.add("open");addMsg("assistant","当前预设需要先在上方「设置」里填 API Key 并保存；或者把预设切回「本站通道」免填直接用。");return;}
  $("input").value="";addMsg("user",text);messages.push({role:"user",content:text});
  busy=true;$("send").textContent="停止";const bodyEl=addMsg("assistant","…");
  aborter=new AbortController();
  const payload={model:cfg.model,stream:true,max_tokens:2048,messages:[{role:"system",content:cfg.sys}].concat(messages)};
  let full="";
  try{
    const r=await fetch(cfg.base+"/chat/completions",{method:"POST",signal:aborter.signal,headers:Object.assign({"Content-Type":"application/json"},cfg.key?{"Authorization":"Bearer "+cfg.key}:{}),body:JSON.stringify(payload)});
    if(!r.ok){let t="";try{t=await r.text()}catch(e){}throw new Error("HTTP "+r.status+" "+t.slice(0,300));}
    if(!r.body)throw new Error("浏览器不支持流式读取");
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        const data=line.slice(5).trim();if(data==="[DONE]")continue;
        try{const j=JSON.parse(data);const d=j.choices&&j.choices[0]&&j.choices[0].delta;if(d&&d.content){full+=d.content;bodyEl.innerHTML=render(full);$("chat").scrollTop=$("chat").scrollHeight;}}catch(e){}
      }
    }
    if(!full){ // 个别接口忽略 stream 返回整包 JSON 的兜底在 catch 外处理不了，这里提示
      bodyEl.textContent="(没收到内容，可能模型名不对或额度用完，去设置里核对模型名)";
    }else{
      messages.push({role:"assistant",content:full});
    }
  }catch(e){
    if(e.name==="AbortError"){if(full)messages.push({role:"assistant",content:full});bodyEl.innerHTML=render(full||"（已停止）");}
    else{bodyEl.innerHTML='<span class="err">出错了：'+esc(e.message)+'</span><br>常见原因：key 不对/没额度（401/403）、模型名不存在（400/404）、接口不支持浏览器直连（Failed to fetch，换魔搭预设）。';}
  }finally{busy=false;$("send").textContent="发送";aborter=null;}
}
$("send").addEventListener("click",()=>{if(busy&&aborter){aborter.abort();}else send();});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
